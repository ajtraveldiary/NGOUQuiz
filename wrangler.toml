name = "ngouquiz"
main = "src/index.js"
compatibility_date = "2026-06-01"

# Game frontend (index.html, app.js, style.css …)
[assets]
directory = "./public"
binding = "ASSETS"

# admin.html and db/schema.sql are bundled into the Worker (admin page is never a public file;
# the schema lets the Worker create and upgrade its own tables)
[[rules]]
type = "Text"
globs = ["**/*.html", "**/*.sql"]
fallthrough = true

[vars]
# The hidden admin page lives at https://<your-domain>/<ADMIN_PATH>
# Change this to something only your team knows.
ADMIN_PATH = "union-control-room"

# Secrets — set with:  npx wrangler secret put <NAME>
#   DATABASE_URL    Neon connection string (postgresql://…?sslmode=require)
#   APP_SECRET      any random string, 32+ characters (signs player and admin tokens)
#   ADMIN_PASSWORD  password for the admin page

# Rate limits (Cloudflare Workers Rate Limiting), requests per minute. The Worker falls back to its own
# counter if these are missing. Keep the numbers in step with LIMITS in src/index.js.
# namespace_id is any number that is unique within your Cloudflare account.
[[ratelimits]]
name = "RL_READ"
namespace_id = "4101"
simple = { limit = 120, period = 60 }

[[ratelimits]]
name = "RL_REGISTER"
namespace_id = "4102"
simple = { limit = 20, period = 60 }

[[ratelimits]]
name = "RL_GAME_IP"
namespace_id = "4103"
simple = { limit = 600, period = 60 }

[[ratelimits]]
name = "RL_START"
namespace_id = "4104"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "RL_PLAY"
namespace_id = "4105"
simple = { limit = 90, period = 60 }

[[ratelimits]]
name = "RL_ADMIN"
namespace_id = "4106"
simple = { limit = 300, period = 60 }
