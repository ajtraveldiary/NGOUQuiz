name = "ngouquiz"
main = "src/index.js"
compatibility_date = "2026-06-01"

# Game frontend (index.html, app.js, style.css …)
[assets]
directory = "./public"
binding = "ASSETS"
# the page itself goes through the Worker first, so it can put the full address into the link-preview tags
run_worker_first = ["/", "/index.html"]

# admin.html and db/schema.sql are bundled into the Worker (admin page is never a public file;
# the schema lets the Worker create and upgrade its own tables)
[[rules]]
type = "Text"
globs = ["**/*.html", "**/*.sql"]
fallthrough = true

# Quiz data: Cloudflare D1 (SQLite). The Worker creates the tables itself on the first request.
# Made with: npx wrangler d1 create ngouquiz --location apac
[[d1_databases]]
binding = "DB"
database_name = "ngouquiz"
database_id = "d0424035-877c-47a3-afc1-3fdb6f5641b4"

# Secrets — set with:  npx wrangler secret put <NAME>
#   ADMIN_PATH      the admin page's address, https://<your-domain>/<ADMIN_PATH> — something only your team knows
#                   (a secret so it is not in this public file; without it there is no admin page)
#   APP_SECRET      any random string, 32+ characters (signs player and admin tokens)
#   ADMIN_PASSWORD  password for the admin page

# Rate limits (Cloudflare Workers Rate Limiting), requests per minute. The Worker falls back to its own
# counter if these are missing. Keep the numbers in step with LIMITS in src/index.js.
# namespace_id is any number that is unique within your Cloudflare account.
[[ratelimits]]
name = "RL_READ"
namespace_id = "4101"
simple = { limit = 120, period = 60 }

[[ratelimits]]
name = "RL_REGISTER"
namespace_id = "4102"
simple = { limit = 20, period = 60 }

[[ratelimits]]
name = "RL_GAME_IP"
namespace_id = "4103"
simple = { limit = 600, period = 60 }

[[ratelimits]]
name = "RL_START"
namespace_id = "4104"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "RL_PLAY"
namespace_id = "4105"
simple = { limit = 90, period = 60 }

[[ratelimits]]
name = "RL_ADMIN"
namespace_id = "4106"
simple = { limit = 300, period = 60 }

[[ratelimits]]
name = "RL_LOGIN"
namespace_id = "4107"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "RL_HEALTH"
namespace_id = "4108"
simple = { limit = 20, period = 60 }
